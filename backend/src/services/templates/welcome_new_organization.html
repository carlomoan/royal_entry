<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <div style="background: linear-gradient(135deg, #0a1628, #1a2744); padding: 24px; text-align: center;">
      <h1 style="color: #d4a843; margin: 0; font-size: 20px;">RoyalEntry</h1>
    </div>
    <div style="padding: 32px;">
      <h2 style="color: #1a2744;">Your Organization is Ready!</h2>
      <p>Dear {{admin_name}},</p>
      <p>Your organization <strong>{{organization_name}}</strong> has been created and is now active on the <strong>{{plan_name}}</strong> plan.</p>
      <a href="{{login_url}}" style="display: inline-block; background: linear-gradient(135deg, #d4a843, #b8932e); color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold;">Login Now</a>
    </div>
  </div>

</html>
