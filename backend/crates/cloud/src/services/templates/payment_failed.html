<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <div style="background: linear-gradient(135deg, #dc2626, #b91c1c); padding: 24px; text-align: center;">
      <h1 style="color: white; margin: 0;">Payment Failed</h1>
    </div>
    <div style="padding: 32px;">
      <p>A recent payment attempt for <strong>{{amount}}</strong> via <strong>{{payment_method}}</strong> has failed.</p>
      <p><strong>Reason:</strong> {{error_reason}}</p>
      <p>Please try again or use a different payment method.</p>
      <a href="{{retry_url}}" style="display: inline-block; background: #d4a843; color: white; padding: 12px 24px; border-radius: 8px;">Retry Payment</a>
    </div>
  </div>
</body>
</html>
