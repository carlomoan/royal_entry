<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px;">
  <div style="max-width: 600px; margin: auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <div style="background: linear-gradient(135deg, #0a1628, #1a2744); padding: 24px; text-align: center;">
      <h1 style="color: #d4a843; margin: 0;">Scheduled Maintenance</h1>
    </div>
    <div style="padding: 32px;">
      <p>Dear RoyalEntry User,</p>
      <p>We will be performing scheduled maintenance on <strong>{{affected_services}}</strong>.</p>
      <div style="background: #fef3c7; border: 1px solid #fbbf24; border-radius: 8px; padding: 16px;">
        <p><strong>Start:</strong> {{maintenance_start}}<br>
        <strong>End:</strong> {{maintenance_end}}</p>
      </div>
      <p>During this time, some services may be unavailable. We apologize for any inconvenience.</p>
      <p>For updates: <a href="{{support_url}}">{{support_url}}</a></p>
    </div>
  </div>
</body>
</html>
