[package]
name = "royalentry-cloud"
version = "0.1.0"
edition = "2021"

[dependencies]
royalentry-core = { path = "../core" }

# Web Framework & Runtime
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1.52", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
hyper = "1.10"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
tokio-postgres = "0.7"
csv = "1.3"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.15"

# UUID, Time & Cryptography
uuid = { version = "1.20", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"

# QR Code & Image Processing
qrcode = "0.14"
image = "0.25"

# Validation & Config
validator = { version = "0.19", features = ["derive"] }
config = { version = "0.15", features = ["json"] }
dotenvy = "0.15"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "2.0"

# Async & HTTP Client
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "query"] }
url = "2.5"

# Misc Utilities
phonenumber = "0.3"
time = "0.3"
tokio-tungstenite = "0.29"
futures-util = "0.3"
email_address = "0.2"
hmac = "0.12"
governor = "0.10"
env_logger = "0.11"
paste = "1.0"
argon2 = "0.5.3"
password-hash = "0.5.0"
axum-extra = { version = "0.10", features = ["typed-header"] }
handlebars = "6.3"
printpdf = "0.7"
regex = "1.11"
subtle = "2.5"
tokio-cron-scheduler = { version = "0.11", features = ["signal"] }

[[bin]]
name = "royalentry"
path = "src/main.rs"
